plugins {
    id 'com.android.application'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "io.rafaelia.fridalab"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            // Default operator compiles MainActivity only. Historical research
            // panel/bridge sources remain present but are not a runtime dependency.
            java.exclude 'io/rafaelia/fridalab/learning/**'
            java.exclude 'io/rafaelia/fridalab/ui/**'
            // MainActivity is programmatic and uses android.R only.
            // Keep historical research_mode_panel.xml in Git, not in Lite APK.
            res.srcDirs = []
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    namespace 'io.rafaelia.fridalab'
}

dependencies {
    // Production: Android framework + platform org.json only.
    // No AppCompat, Material, ConstraintLayout, Gson, or OkHttp are needed by
    // the active one-screen operator. Test dependencies are build-only.

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
