name: RAFAELIA CI provider minimal probe

on:
  push:
    branches:
      - audit/ci-prejob-evidence-receipt-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Provider accepted workflow and materialized job
        shell: bash
        run: |
          set -eu
          printf '%s\n' 'RAFAELIA_PROVIDER_MINIMAL_PASS'

  provider-needs:
    needs: provider-minimal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        probe: [alpha, beta]
    steps:
      - name: Provider accepted simple needs plus minimal matrix
        shell: bash
        run: |
          set -eu
          printf '%s:%s\n' 'RAFAELIA_PROVIDER_MATRIX_PASS' '${{ matrix.probe }}'

  provider-expression:
    needs: provider-minimal
    if: github.ref == 'refs/heads/audit/ci-prejob-evidence-receipt-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Provider accepted github.ref expression context
        shell: bash
        run: |
          set -eu
          printf '%s:%s\n' 'RAFAELIA_PROVIDER_EXPRESSION_PASS' '${{ github.ref }}'
