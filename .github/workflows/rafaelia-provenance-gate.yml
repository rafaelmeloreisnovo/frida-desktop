name: RAFAELIA Provenance Non-Regression Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rafaelia-provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: provenance / fail-closed delta boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full ancestry
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate provenance, evidence, and negative falsifiers
        run: bash .github/scripts/rafaelia/provenance-ci.sh all

      - name: Upload deterministic provenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rafaelia-provenance-${{ github.run_id }}
          path: evidence/provenance/
          if-no-files-found: error
          retention-days: 30
