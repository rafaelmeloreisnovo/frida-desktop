name: Android crash observability

on:
  pull_request:
    paths:
      - 'agents/android-crash-observer.js'
      - 'tools/frida-runtime-crash-observer.*'
      - 'tools/android-crash-spine.sh'
      - 'profiles/android-crash-observability.v1.json'
      - 'docs/android-crash-observability.md'
      - '.github/scripts/rafaelia/android-crash-observability-ci.sh'
      - '.github/workflows/android-crash-observability.yml'
  push:
    branches:
      - main
    paths:
      - 'agents/android-crash-observer.js'
      - 'tools/frida-runtime-crash-observer.*'
      - 'tools/android-crash-spine.sh'
      - 'profiles/android-crash-observability.v1.json'
      - 'docs/android-crash-observability.md'
      - '.github/scripts/rafaelia/android-crash-observability-ci.sh'
      - '.github/workflows/android-crash-observability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-crash-observability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  structural-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, Node 24
        with:
          persist-credentials: false

      - name: Run fail-closed crash observability gate
        run: bash .github/scripts/rafaelia/android-crash-observability-ci.sh all

      - name: Upload crash observability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: android-crash-observability-${{ github.run_id }}
          path: evidence/android-crash-observability/
          if-no-files-found: error
          retention-days: 14
