name: Workflow Architecture Contract

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/rafaelia/**"
      - "tools/validate-rafaelia-provenance.py"
      - "profiles/rafaelia-provenance-scope.v1.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/scripts/rafaelia/**"
      - "tools/validate-rafaelia-provenance.py"
      - "profiles/rafaelia-provenance-scope.v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  workflow-contract:
    name: Workflow topology + catalyst contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, Node 24
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Syntax-check workflow implementation scripts
        run: |
          set -euo pipefail
          bash -n .github/scripts/rafaelia/ci-common.sh
          bash -n .github/scripts/rafaelia/host-tools.sh
          bash -n .github/scripts/rafaelia/android-lab-ci.sh
          bash -n .github/scripts/rafaelia/on-device-receipt-verifier-gate.sh
          bash -n .github/scripts/rafaelia/rfl-neon4096-selftest.sh
          bash -n .github/scripts/rafaelia/runtime-aided-hardening.sh
          bash -n .github/scripts/rafaelia/runtime-learning-engine-ci.sh
          bash -n .github/scripts/rafaelia/provenance-ci.sh
          bash -n .github/scripts/rafaelia/android-crash-observability-ci.sh
          bash -n .github/scripts/rafaelia/atlas-mission-consumer-gate.sh
          bash -n .github/scripts/rafaelia/arm32-neon4096-freestanding-gate.sh
          bash -n .github/scripts/rafaelia/arm32-neon4096-physical-bench-adapter-gate.sh
          bash -n .github/scripts/rafaelia/hash-bitexact-backend-gate.sh
          bash -n .github/scripts/rafaelia/hash-bitexact-streaming-neon-gate.sh
          bash -n .github/scripts/rafaelia/hash-math-plugin-freestanding-gate.sh
          python3 -m py_compile .github/scripts/rafaelia/workflow-contract.py
          python3 -m py_compile tools/validate-rafaelia-provenance.py
          python3 -m py_compile tools/validate_frida_atlas_mission_binding.py
          grep -Fq 'run: bash .github/scripts/rafaelia/on-device-receipt-verifier-gate.sh' .github/workflows/android17-apk-elf-dex.yml
          grep -Fq 'final-verdict:' .github/workflows/01.yml

      - name: Run fail-closed workflow + catalyst contract
        run: python3 .github/scripts/rafaelia/workflow-contract.py

      - name: Check patch whitespace integrity
        run: git diff --check HEAD^ HEAD

      - name: Upload workflow contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: workflow-contract-${{ github.run_id }}
          path: evidence/workflow-contract/
          if-no-files-found: error
          retention-days: 14
