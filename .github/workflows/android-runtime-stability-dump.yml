name: Android runtime stability dump

on:
  pull_request:
    paths:
      - 'agents/android-runtime-stability-dump.js'
      - 'profiles/android-runtime-stability-dump.v1.json'
      - 'profiles/android-runtime-stability-dump.v2.json'
      - 'profiles/runtime-stability-falsification-matrix.v1.json'
      - 'profiles/runtime-stability-omission-ledger.v1.json'
      - 'profiles/runtime-stability-evidence-source-matrix.v1.json'
      - 'tools/runtime-stability-diff.py'
      - 'tools/capture-runtime-stability-dump.py'
      - 'modules/runtime-learning-engine/runtime-stability-hypermemory-bridge.ts'
      - 'modules/runtime-learning-engine/tests/runtime-stability-hypermemory-bridge.test.ts'
      - 'modules/runtime-learning-engine/index.ts'
      - 'profiles/runtime-stability-methodology.v1.json'
      - 'profiles/runtime-stability-methods-matrix.v1.json'
      - 'tools/runtime_stability_storage.py'
      - 'tools/runtime-stability-baseline.py'
      - 'tools/runtime-stability-evidence-gate.py'
      - 'docs/runtime-stability-falsifiability.md'
      - '.github/scripts/rafaelia/runtime-stability-falsifiability-merge-ci.sh'
      - 'docs/android-runtime-stability-dump.md'
      - '.github/scripts/rafaelia/android-runtime-stability-dump-ci.sh'
      - '.github/workflows/android-runtime-stability-dump.yml'
  push:
    branches:
      - main
    paths:
      - 'agents/android-runtime-stability-dump.js'
      - 'profiles/android-runtime-stability-dump.v1.json'
      - 'profiles/android-runtime-stability-dump.v2.json'
      - 'profiles/runtime-stability-falsification-matrix.v1.json'
      - 'profiles/runtime-stability-omission-ledger.v1.json'
      - 'profiles/runtime-stability-evidence-source-matrix.v1.json'
      - 'tools/runtime-stability-diff.py'
      - 'tools/capture-runtime-stability-dump.py'
      - 'modules/runtime-learning-engine/runtime-stability-hypermemory-bridge.ts'
      - 'modules/runtime-learning-engine/tests/runtime-stability-hypermemory-bridge.test.ts'
      - 'modules/runtime-learning-engine/index.ts'
      - 'profiles/runtime-stability-methodology.v1.json'
      - 'profiles/runtime-stability-methods-matrix.v1.json'
      - 'tools/runtime_stability_storage.py'
      - 'tools/runtime-stability-baseline.py'
      - 'tools/runtime-stability-evidence-gate.py'
      - 'docs/runtime-stability-falsifiability.md'
      - '.github/scripts/rafaelia/runtime-stability-falsifiability-merge-ci.sh'
      - 'docs/android-runtime-stability-dump.md'
      - '.github/scripts/rafaelia/android-runtime-stability-dump-ci.sh'
      - '.github/workflows/android-runtime-stability-dump.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-stability-dump-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  structural-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate runtime stability dump
        run: bash .github/scripts/rafaelia/android-runtime-stability-dump-ci.sh

      - name: Validate repeated-measure falsifiability successor
        run: bash .github/scripts/rafaelia/runtime-stability-falsifiability-merge-ci.sh

      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-runtime-stability-dump-${{ github.run_id }}
          path: evidence/android-runtime-stability-dump/
          if-no-files-found: error
          retention-days: 14
