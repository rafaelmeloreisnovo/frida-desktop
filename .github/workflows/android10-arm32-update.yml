name: Android 10 ARM32 Update Lab

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frida-arm32-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-update-apk:
    runs-on: ubuntu-latest
    env:
      MIN_SDK: "21"
      TARGET_SDK: "37"
      NDK_VERSION: "29.0.14206865"
      FRIDA_VERSION: "17.9.11"
      UPDATE_KEYSTORE_B64: ${{ secrets.RAFAELIA_UPDATE_KEYSTORE_B64 }}
      UPDATE_STORE_PASSWORD: ${{ secrets.RAFAELIA_UPDATE_STORE_PASSWORD }}
      UPDATE_KEY_PASSWORD: ${{ secrets.RAFAELIA_UPDATE_KEY_PASSWORD }}
      UPDATE_KEY_ALIAS: ${{ secrets.RAFAELIA_UPDATE_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve Android toolchain
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends curl unzip xz-utils zip binutils >/dev/null
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;${NDK_VERSION}" >/dev/null
          echo "bt=${ANDROID_SDK_ROOT}/build-tools/37.0.0" >> "$GITHUB_OUTPUT"
          echo "jar=${ANDROID_SDK_ROOT}/platforms/android-37/android.jar" >> "$GITHUB_OUTPUT"
          echo "tc=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned ARM32 Frida Gadget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/update/native/armeabi-v7a evidence
          asset="frida-gadget-${FRIDA_VERSION}-android-arm.so.xz"
          api="https://api.github.com/repos/frida/frida/releases/tags/${FRIDA_VERSION}"
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${{ github.token }}" \
            "$api" -o evidence/frida-release.json
          python3 - "$asset" <<'PY' > evidence/frida-arm32.tsv
          import json, sys
          r=json.load(open('evidence/frida-release.json'))
          name=sys.argv[1]
          a=next((x for x in r.get('assets',[]) if x.get('name')==name),None)
          if not a: raise SystemExit('missing pinned ARM32 gadget')
          d=a.get('digest','')
          if not d.startswith('sha256:'): raise SystemExit('missing release digest')
          print(a['browser_download_url'], d.split(':',1)[1], sep='\t')
          PY
          IFS=$'\t' read -r url expected < evidence/frida-arm32.tsv
          curl --fail --silent --show-error --location "$url" -o "build/update/$asset"
          actual="$(sha256sum "build/update/$asset" | awk '{print $1}')"
          test "$actual" = "$expected"
          xz -t "build/update/$asset"
          xz -dc "build/update/$asset" > build/update/native/armeabi-v7a/libfrida-gadget.so
          printf 'frida_gadget_sha256=%s\n' "$actual" > evidence/frida-arm32.digest.txt

      - name: Build ARM32 probe
        shell: bash
        env:
          TC: ${{ steps.tools.outputs.tc }}
        run: |
          set -euo pipefail
          "$TC/armv7a-linux-androideabi${MIN_SDK}-clang" \
            -std=c11 -O2 -fPIC -fvisibility=hidden -shared \
            -Wl,-soname,librafaelia-probe.so \
            -Wl,--build-id=sha1 \
            -o build/update/native/armeabi-v7a/librafaelia-probe.so \
            android/frida-lab/native/elf_probe.c
          readelf -h build/update/native/armeabi-v7a/librafaelia-probe.so | grep -Eq 'Machine:[[:space:]]+ARM([[:space:]]|$)'
          readelf -Ws build/update/native/armeabi-v7a/librafaelia-probe.so | grep -q rafaelia_elf_probe_identity

      - name: Compile BOTH Android activities to DEX
        shell: bash
        env:
          ANDROID_JAR: ${{ steps.tools.outputs.jar }}
          BT: ${{ steps.tools.outputs.bt }}
        run: |
          set -euo pipefail
          mkdir -p build/update/classes build/update/dex
          javac --release 8 -classpath "$ANDROID_JAR" -d build/update/classes \
            android/frida-lab/src/io/rafaelia/fridalab/MainActivity.java \
            android/frida-lab/src/io/rafaelia/fridalab/OneClickActivity.java
          test -f build/update/classes/io/rafaelia/fridalab/MainActivity.class
          test -f build/update/classes/io/rafaelia/fridalab/OneClickActivity.class
          mapfile -t classes < <(find build/update/classes -type f -name '*.class' -print | sort)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api "$MIN_SDK" --output build/update/dex "${classes[@]}"
          strings build/update/dex/classes.dex | grep -q 'Lio/rafaelia/fridalab/OneClickActivity;'
          strings build/update/dex/classes.dex | grep -q 'Lio/rafaelia/fridalab/MainActivity;'

      - name: Build and sign update candidate
        id: apk
        shell: bash
        env:
          ANDROID_JAR: ${{ steps.tools.outputs.jar }}
          BT: ${{ steps.tools.outputs.bt }}
        run: |
          set -euo pipefail
          mkdir -p build/update/apk/stage/lib/armeabi-v7a dist
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="17-api37-arm32-update-${GITHUB_RUN_NUMBER}"

          "$BT/aapt2" link -o build/update/apk/base.apk -I "$ANDROID_JAR" \
            --manifest android/frida-lab/AndroidManifest.xml \
            --min-sdk-version "$MIN_SDK" --target-sdk-version "$TARGET_SDK" \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME"
          cp build/update/apk/base.apk build/update/apk/unsigned.apk
          (cd build/update/dex && zip -q ../../apk/unsigned.apk classes.dex)

          cp build/update/native/armeabi-v7a/libfrida-gadget.so build/update/apk/stage/lib/armeabi-v7a/
          cp build/update/native/armeabi-v7a/librafaelia-probe.so build/update/apk/stage/lib/armeabi-v7a/
          cat > build/update/apk/stage/lib/armeabi-v7a/libfrida-gadget.config.so <<'JSON'
          {"interaction":{"type":"listen","address":"127.0.0.1","port":27042,"on_port_conflict":"fail","on_load":"resume"},"teardown":"minimal","runtime":"default"}
          JSON
          (cd build/update/apk/stage && zip -q -r ../unsigned.apk lib)
          "$BT/zipalign" -p -f 4 build/update/apk/unsigned.apk build/update/apk/aligned.apk

          signing_mode="EPHEMERAL_LAB"
          update_compatible="false"
          ks=build/update/ephemeral.keystore
          storepass=android
          keypass=android
          alias=androiddebugkey

          if [[ -n "${UPDATE_KEYSTORE_B64:-}" && -n "${UPDATE_STORE_PASSWORD:-}" && -n "${UPDATE_KEY_PASSWORD:-}" && -n "${UPDATE_KEY_ALIAS:-}" ]]; then
            printf '%s' "$UPDATE_KEYSTORE_B64" | base64 --decode > build/update/stable-update.keystore
            chmod 600 build/update/stable-update.keystore
            ks=build/update/stable-update.keystore
            storepass="$UPDATE_STORE_PASSWORD"
            keypass="$UPDATE_KEY_PASSWORD"
            alias="$UPDATE_KEY_ALIAS"
            signing_mode="STABLE_UPDATE"
            update_compatible="true"
          else
            keytool -genkeypair -keystore "$ks" -storepass "$storepass" -alias "$alias" -keypass "$keypass" \
              -dname "CN=Android Debug,O=RAFAELIA,C=BR" -keyalg RSA -keysize 2048 -validity 3650 -noprompt >/dev/null 2>&1
          fi

          "$BT/apksigner" sign --ks "$ks" --ks-pass "pass:$storepass" --key-pass "pass:$keypass" \
            --ks-key-alias "$alias" --out dist/frida-lab-arm32-update.apk build/update/apk/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs dist/frida-lab-arm32-update.apk | tee dist/apksigner-verify.txt
          "$BT/zipalign" -c -p 4 dist/frida-lab-arm32-update.apk
          signer_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/apksigner-verify.txt | head -n1)"
          test -n "$signer_sha256"
          printf 'version_code=%s\nversion_name=%s\nsigning_mode=%s\nupdate_compatible=%s\nsigner_sha256=%s\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$signing_mode" "$update_compatible" "$signer_sha256" \
            | tee dist/update-build.env
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "signing_mode=$signing_mode" >> "$GITHUB_OUTPUT"
          echo "update_compatible=$update_compatible" >> "$GITHUB_OUTPUT"
          echo "signer_sha256=$signer_sha256" >> "$GITHUB_OUTPUT"

      - name: Produce fail-closed update receipt
        shell: bash
        env:
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          SIGNING_MODE: ${{ steps.apk.outputs.signing_mode }}
          UPDATE_COMPATIBLE: ${{ steps.apk.outputs.update_compatible }}
          SIGNER_SHA256: ${{ steps.apk.outputs.signer_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path('dist/frida-lab-arm32-update.apk')
          apk_sha=hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={
            'schema':'rafaelia.frida.arm32-update.receipt.v1',
            'source_commit':os.environ['GITHUB_SHA'],
            'package':'io.rafaelia.fridalab',
            'abi':'armeabi-v7a',
            'android_target':'Android 10 / API 29 device-compatible; minSdk 21',
            'frida_version':os.environ['FRIDA_VERSION'],
            'version_code':int(os.environ['VERSION_CODE']),
            'version_name':os.environ['VERSION_NAME'],
            'launcher':'io.rafaelia.fridalab.OneClickActivity',
            'compiled_activities':['MainActivity','OneClickActivity'],
            'dex_one_click_gate':'PASS',
            'signing_mode':os.environ['SIGNING_MODE'],
            'signer_sha256':os.environ['SIGNER_SHA256'],
            'update_compatible_with_same_signer':os.environ['UPDATE_COMPATIBLE']=='true',
            'installed_signer_match':'TOKEN_VAZIO_DEVICE',
            'apk_sha256':apk_sha,
            'physical_device_install_r':'TOKEN_VAZIO_DEVICE',
            'physical_device_launch':'TOKEN_VAZIO_DEVICE',
            'learning_observation_source':'REAL_FRIDA_HOOKS_ONLY',
            'automatic_active':'DISABLED',
            'claim_allowed':False,
          }
          Path('dist/receipt.arm32-update.v1.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
          sha256sum dist/frida-lab-arm32-update.apk dist/receipt.arm32-update.v1.json > dist/SHA256SUMS.txt

      - name: Upload ARM32 update candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: frida-arm32-update-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/
            evidence/
