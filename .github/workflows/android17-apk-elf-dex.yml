name: Android 17 APK + ELF/DEX Lab

on:
  pull_request:
    paths:
      - "android/frida-lab/**"
      - ".github/scripts/rafaelia/android-lab-ci.sh"
      - ".github/scripts/rafaelia/ci-common.sh"
      - ".github/workflows/android17-apk-elf-dex.yml"
  push:
    branches:
      - main
    paths:
      - "android/frida-lab/**"
      - ".github/scripts/rafaelia/android-lab-ci.sh"
      - ".github/scripts/rafaelia/ci-common.sh"
      - ".github/workflows/android17-apk-elf-dex.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android17-apk-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-apk:
    name: Build + verify Android lab artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPILE_SDK: "37"
      TARGET_SDK: "37"
      MIN_SDK: "21"
      NDK_VERSION: "29.0.14206865"
      FRIDA_VERSION: "17.9.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install host inspection tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            curl \
            file \
            unzip \
            xz-utils \
            zip

      - name: Resolve Android SDK + Build-Tools + NDK contract
        run: bash .github/scripts/rafaelia/android-lab-ci.sh resolve-sdk

      - name: Fetch pinned official Frida Gadget assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/rafaelia/android-lab-ci.sh fetch-frida

      - name: Cross-compile ARMv7 + ARM64 source-built probes
        run: bash .github/scripts/rafaelia/android-lab-ci.sh build-native

      - name: Verify ELF ABI + symbols + linker page contract
        run: bash .github/scripts/rafaelia/android-lab-ci.sh verify-native

      - name: Compile Java to verified DEX
        run: bash .github/scripts/rafaelia/android-lab-ci.sh build-dex

      - name: Build + align + sign + inspect APKs
        run: bash .github/scripts/rafaelia/android-lab-ci.sh package-apks

      - name: Emit checksum-bound receipt
        run: bash .github/scripts/rafaelia/android-lab-ci.sh receipt

      - name: Upload APK + ELF + DEX + provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: frida-android17-apk-elf-dex-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/android17-lab/
            build/android17/native/
            build/android17/dex/classes.dex
            evidence/android17-lab/
