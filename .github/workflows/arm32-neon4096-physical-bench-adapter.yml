name: ARM32 NEON4096 Physical Benchmark Adapter Gate

on:
  pull_request:
    paths:
      - "tools/arm32-neon4096-physical-bench.c"
      - "tools/arm32-neon4096-physical-bench.sh"
      - "tools/arm32-neon4096-multicore-bench.sh"
      - ".github/scripts/rafaelia/arm32-neon4096-physical-bench-adapter-gate.sh"
      - ".github/workflows/arm32-neon4096-physical-bench-adapter.yml"
      - "android/app/native/neon4096_armv7.S"
      - "android/app/native/neon4096_freestanding.h"
      - "docs/arm32-neon4096-physical-benchmark.md"
  push:
    branches:
      - main
    paths:
      - "tools/arm32-neon4096-physical-bench.c"
      - "tools/arm32-neon4096-physical-bench.sh"
      - "tools/arm32-neon4096-multicore-bench.sh"
      - ".github/scripts/rafaelia/arm32-neon4096-physical-bench-adapter-gate.sh"
      - ".github/workflows/arm32-neon4096-physical-bench-adapter.yml"
      - "android/app/native/neon4096_armv7.S"
      - "android/app/native/neon4096_freestanding.h"
      - "docs/arm32-neon4096-physical-benchmark.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm32-neon4096-physical-bench-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  structural-adapter-gate:
    name: Static-buffer adapter + strict leaf boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, Node 24
        with:
          persist-credentials: false

      - name: Compile adapter variants and re-audit strict leaf
        run: bash .github/scripts/rafaelia/arm32-neon4096-physical-bench-adapter-gate.sh

      - name: Upload structural adapter evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: arm32-neon4096-physical-bench-adapter-${{ github.run_id }}
          path: |
            evidence/arm32-neon4096-physical-bench-adapter/
            evidence/arm32-neon4096-freestanding/
          if-no-files-found: error
          retention-days: 14
