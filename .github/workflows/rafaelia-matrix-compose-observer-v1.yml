name: RAFAELIA Matrix Compose Observer V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "profiles/matrix-compose-observer.v1.json"
      - "tools/rafaelia-matrix-compose-agent.js"
      - ".github/scripts/rafaelia/matrix-compose-observer.py"
      - ".github/scripts/rafaelia/test_matrix_compose_observer.py"
      - ".github/scripts/rafaelia/workflow-contract.py"
      - ".github/workflows/rafaelia-matrix-compose-observer-v1.yml"

permissions:
  contents: read

concurrency:
  group: rafaelia-matrix-compose-observer-v1-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  observer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Profile syntax
        run: python3 -m json.tool profiles/matrix-compose-observer.v1.json >/dev/null
      - name: Observer tests
        run: python3 .github/scripts/rafaelia/test_matrix_compose_observer.py
      - name: Static Frida-agent safety boundary
        run: |
          grep -q 'rpc.exports' tools/rafaelia-matrix-compose-agent.js
          ! grep -E 'Interceptor\.attach|NativeFunction|SystemFunction|exec\(|spawn\(' tools/rafaelia-matrix-compose-agent.js
