name: Android 17 RFL + NEON4096 Learning Selftest

on:
  pull_request:
    paths:
      - "android/frida-lab/native/learning_store.h"
      - "android/frida-lab/native/learning_store.c"
      - "android/frida-lab/native/learning_store_selftest.c"
      - "android/frida-lab/native/neon4096_core.h"
      - "android/frida-lab/native/neon4096_core.c"
      - "android/frida-lab/native/learning_runtime.h"
      - "android/frida-lab/native/learning_runtime.c"
      - "android/frida-lab/native/learning_runtime_selftest.c"
      - "android/frida-lab/native/elf_probe.c"
      - ".github/scripts/rafaelia/rfl-neon4096-selftest.sh"
      - ".github/scripts/rafaelia/ci-common.sh"
      - ".github/workflows/android17-rfl-selftest.yml"
  push:
    branches:
      - main
    paths:
      - "android/frida-lab/native/learning_store.h"
      - "android/frida-lab/native/learning_store.c"
      - "android/frida-lab/native/learning_store_selftest.c"
      - "android/frida-lab/native/neon4096_core.h"
      - "android/frida-lab/native/neon4096_core.c"
      - "android/frida-lab/native/learning_runtime.h"
      - "android/frida-lab/native/learning_runtime.c"
      - "android/frida-lab/native/learning_runtime_selftest.c"
      - "android/frida-lab/native/elf_probe.c"
      - ".github/scripts/rafaelia/rfl-neon4096-selftest.sh"
      - ".github/scripts/rafaelia/ci-common.sh"
      - ".github/workflows/android17-rfl-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rfl-neon4096-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  structural-learning-gate:
    name: RFL + NEON4096 structural learning gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile with strict C11 warnings
        run: bash .github/scripts/rafaelia/rfl-neon4096-selftest.sh compile

      - name: Run RFL + frozen-validation gates
        run: bash .github/scripts/rafaelia/rfl-neon4096-selftest.sh run

      - name: Emit source identity + receipt
        run: bash .github/scripts/rafaelia/rfl-neon4096-selftest.sh evidence

      - name: Upload structural learning evidence
        uses: actions/upload-artifact@v4
        with:
          name: rfl-neon4096-selftest-${{ github.run_id }}
          path: evidence/rfl-neon4096/
          if-no-files-found: error
          retention-days: 14
