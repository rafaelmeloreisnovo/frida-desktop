name: Runtime-Aided Debugger Hardening

on:
  pull_request:
    paths:
      - "tools/frida-runtime-aided-adapter.c"
      - "tools/frida-runtime-aided-adapter.h"
      - "tools/frida-runtime-aided-adapter-selftest.c"
      - "tools/frida-runtime-stability-recorder.h"
      - ".github/scripts/rafaelia/runtime-aided-hardening.sh"
      - ".github/scripts/rafaelia/ci-common.sh"
      - ".github/workflows/runtime-aided-debugger-hardening.yml"
  push:
    branches:
      - main
    paths:
      - "tools/frida-runtime-aided-adapter.c"
      - "tools/frida-runtime-aided-adapter.h"
      - "tools/frida-runtime-aided-adapter-selftest.c"
      - "tools/frida-runtime-stability-recorder.h"
      - ".github/scripts/rafaelia/runtime-aided-hardening.sh"
      - ".github/scripts/rafaelia/ci-common.sh"
      - ".github/workflows/runtime-aided-debugger-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-aided-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  structural-gate:
    name: Hosted + freestanding + sanitizer gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, Node 24
        with:
          persist-credentials: false

      - name: Hosted C11 self-test
        run: bash .github/scripts/rafaelia/runtime-aided-hardening.sh hosted

      - name: Freestanding compile gate
        run: bash .github/scripts/rafaelia/runtime-aided-hardening.sh freestanding

      - name: ASan + UBSan self-test
        run: bash .github/scripts/rafaelia/runtime-aided-hardening.sh sanitizers

      - name: Emit source identity + receipt
        run: bash .github/scripts/rafaelia/runtime-aided-hardening.sh evidence

      - name: Upload runtime-aided hardening evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: runtime-aided-hardening-${{ github.run_id }}
          path: evidence/runtime-aided-hardening/
          if-no-files-found: error
          retention-days: 14
